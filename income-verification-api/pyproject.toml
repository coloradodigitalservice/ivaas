[project]
name = "income-verification-api"
version = "0.1.0"
description = "Income Verification as a Service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django==6.0.8",
    "django-environ>=0.14.0",
    "django-ninja>=1.6.2",
    "ivaas-core",
    "psycopg[binary]==3.3.4",
    "pyjwt[crypto]>=2.13.0",
    "pybreaker>=1.4.1",
    "tenacity>=9.1.4",
    "pyjwt[crypto]>=2.13.0",
    "uvicorn[standard]==0.52.2",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ivaas-core = { workspace = true }

[tool.uv]
# sqlparse is a django dependency. This constraint can be removed once the django
# dependency constraint for sqlparse catches up.
constraint-dependencies = ["sqlparse>=0.6.0"]

[dependency-groups]
dev = [
    {include-group = "quality"},
    {include-group = "test"},
    "django-stubs>=6.0.7",
]
quality = [
    "pre-commit>=4.6.0",
    "mypy>=2.1.0",
    "ruff>=0.15.20",
]
test = [
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # Pyflakes
    "UP",   # Modern Python syntax
    "B",    # Common bugs
    "SIM",  # Simplification rules
    "I",    # Import rules

    # Extended rules
    "PT",   # Pytest conventions
    "LOG",  # Logging
    "C4",   # Comprehensions
    "S",    # Bandit-derived security checks
    "A",    # Prevent shadowing Python builtins
    "PERF", # Common performance issues
    "RUF",  # Ruff
    "INP001", # Check for missing __init__.py files
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["INP001", "S101"]
"packages/*/tests/**" = ["INP001", "S101"]
"**/migrations/*.py" = ["RUF012", "E501"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
strict = true
warn_unreachable = true
pretty = true
show_error_context = true

[[tool.mypy.overrides]]
module = ["environ", "environ.*"]
ignore_missing_imports = true

[tool.pytest]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = [
    "--cov",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=80",
]
testpaths = ["tests", "packages"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["income_verification", "adapter_engine", "ivaas_core"]
omit = ["*/migrations/*"]
branch = true

[tool.django-stubs]
django_settings_module = "config.settings"
