name: QA Checks

on:
  pull_request:
    branches:
      - main
    types:
      - opened # default
      - synchronize # default
      - reopened # default
      - ready_for_review # run skipped jobs when marking PR ready for review
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Run QA checks
    runs-on: ubuntu-latest
    env:
      ADAPTERS_ENV: .envs/.ci/.adapters
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 #v9.0.0
        with:
          enable-cache: true
          cache-python: true
          version-file: ".tool-versions"

      # TODO: This currently build a generic version of the app (no adapters)
      #       Would need to checkout and build adapter repositories for integration tests
      - name: Install dependencies
        run: make sync-ci

      - name: Run pre-commit
        env:
          SKIP: no-commit-to-branch
        run: make pre-commit

        # Running this separately because the pre-commit is running this on push only
      - name: Local quality checks pass
        run: make quality-check

      - name: Run tests
        run: make test

      - name: Docker image builds and serves
        run: make up

      - name: Health check
        run: curl --fail --silent --show-error http://127.0.0.1:8000/api/health

      - name: Build smoke test image
        run: make smoke-image

      - name: Smoke tests against the running image
        env:
          SMOKE_BASE_URL: http://127.0.0.1:8000
          SMOKE_TOKEN_URL: http://127.0.0.1:8090/default/token
          SMOKE_CLIENT_ID: local-client
          SMOKE_CLIENT_SECRET: local-secret
          SMOKE_EXPECTED_AGENCY: local-agency
          SMOKE_EXPECTED_ENVIRONMENT: local
        run: |
          mkdir -p smoke-results
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD/smoke-results,target=/results" \
            -e SMOKE_BASE_URL -e SMOKE_TOKEN_URL \
            -e SMOKE_CLIENT_ID -e SMOKE_CLIENT_SECRET \
            -e SMOKE_EXPECTED_AGENCY -e SMOKE_EXPECTED_ENVIRONMENT \
            ivaas-smoke:local

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-results
          path: smoke-results/smoke-results.xml
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: make down
