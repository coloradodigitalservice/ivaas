services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: income_verification_api
      POSTGRES_USER: income_verification_api
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U income_verification_api -d income_verification_api",
        ]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
