services:
  postgres:
    image: postgres:17
    env_file:
      - ./income-verification-api/.envs/.local/.postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5
  income-verification-api:
    build:
      context: ./income-verification-api
    env_file:
      - ./income-verification-api/.envs/.local/.django
      - ./income-verification-api/.envs/.local/.postgres
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      start_period: 10s
      start_interval: 1s
      interval: 1m
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
