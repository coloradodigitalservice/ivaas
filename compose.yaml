services:
  postgres:
    image: postgres:17
    env_file:
      - ./income-verification-api/.envs/.local/.postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5
  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.2
    environment:
      # Customizing mock tokens here to include the claims emitted by AWS Cognito. Not all claim properties are used by IVaaS authorization.
      JSON_CONFIG: >-
        {"tokenCallbacks":[{"issuerId":"default","requestMappings":[{"requestParam":"grant_type","match":"client_credentials","claims":{"sub":"$${clientId}","client_id":"$${clientId}","token_use":"access","scope":"ivaas/income.verify","auth_time":0,"version":2}}]}]}
    ports:
      - "127.0.0.1:8090:8080"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/isalive",
        ]
      start_period: 5s
      interval: 2s
      timeout: 1s
      retries: 10
  income-verification-api:
    build:
      context: ./income-verification-api
    env_file:
      - ./income-verification-api/.envs/.local/.django
      - ./income-verification-api/.envs/.local/.postgres
      - ./income-verification-api/${ADAPTERS_ENV:-.envs/.local/.adapters}
      - path: ./income-verification-api/.envs/.local/.secrets
        required: false
    environment:
      POSTGRES_HOST: postgres
      # Inside the container, localhost is the container itself; the local
      # mock publishes on the host, reachable as host.docker.internal.
      CDLE_ACCOUNT_URL: http://host.docker.internal:8890
      CDLE_ENVIRONMENT: DEV
      # Tokens are issued through the host URL, so AUTH_ISSUER remains the public URL. Only JWKS
      # retrieval uses the Compose network address.
      AUTH_JWKS_URL: http://mock-oauth2-server:8080/default/jwks
    extra_hosts:
      # Provides host.docker.internal on Linux engines too (native on Docker Desktop).
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mock-oauth2-server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      start_period: 10s
      start_interval: 1s
      interval: 1m
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
